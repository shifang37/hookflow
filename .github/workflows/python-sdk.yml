name: python-sdk

# Placeholder for the Python SDK (roadmap P2, task P). `sdk/python/` does not
# exist yet, so the path filter keeps this job dormant: it becomes active by
# itself when task P lands, without editing this file. Until then it must not be
# described as "Python SDK passes CI".
#
# The workflow file itself is deliberately NOT in the path filters below: the
# first version included it, so adding this file triggered the job and it failed
# on `sdk/python` not existing (run 41022043877). Once task P adds sdk/python/**,
# every change there triggers the job; a workflow-only edit before that point has
# nothing to test anyway.
on:
  push:
    paths:
      - 'sdk/python/**'
  pull_request:
    paths:
      - 'sdk/python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Typecheck
        run: mypy .

      - name: Unit tests with coverage
        run: pytest --cov=hookflow --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-coverage
          path: sdk/python/coverage.xml
          if-no-files-found: ignore
