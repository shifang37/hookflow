name: ci

on:
  push:
    # master is this repository's default branch; main is kept so a future rename
    # does not silently stop CI again (it listened only on main until v0.3, and
    # therefore never ran at all).
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests need no containers: this is the fast feedback loop.
      - name: Unit tests
        run: ./mvnw -B test

      # Coverage comes from unit tests only: the `coverage` profile binds the JaCoCo
      # agent to surefire and never to the Testcontainers ITs below, so the number
      # Codecov sees is not diluted (or slowed down) by integration tests.
      - name: Unit tests with JaCoCo
        run: ./mvnw -B -Pcoverage test

      # `secrets` is not a valid context in a step-level `if:` (GitHub rejects it),
      # so the token is read by a shell step and exposed as an output. A fork PR
      # never receives secrets and this repository has no CODECOV_TOKEN configured
      # yet, so the default path is: generate the report, skip the upload, say why.
      - name: Check Codecov configuration
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not configured; coverage was generated but not uploaded."
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pull request: secrets are not available to forks, so coverage was not uploaded."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.codecov.outputs.enabled == 'true' }}
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # A missing or expired token must not turn a green test run red; the
          # previous step's log is the signal that the upload was skipped.
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # `verify` runs the failsafe ITs, which start MySQL and RabbitMQ through
      # Testcontainers and assert the behaviours this project claims to guarantee.
      - name: Unit + integration tests
        run: ./mvnw -B verify -DskipITs=false

      # A failure that only shows "exit code 1" wastes a whole iteration. The reports
      # contain the actual assertion text, so put them in the log.
      - name: Show failed test reports
        if: failure()
        run: |
          for f in target/failsafe-reports/*.txt target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            sed -n '1,80p' "$f"
            echo "::endgroup::"
          done

      - name: Package
        run: ./mvnw -B -DskipTests package

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # The console is a separate toolchain, so it gets its own job: a broken frontend must
  # not make the backend suite look red, and the backend's 4-minute Testcontainers run
  # must not block the frontend's 30 seconds.
  frontend:
    runs-on: ubuntu-latest
    env:
      # AntD + jsdom + v8 coverage: the default V8 heap is the first thing to go
      # once the slow create/drawer tests are allowed to finish instead of
      # timing out (run 17 exited 1 with no failing-test annotation, which is the
      # signature of a process-level memory failure rather than an assertion).
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` over `npm install`: the lockfile is the contract, and a CI that
      # resolves fresh versions is testing something the developer never ran.
      - name: Install
        run: npm ci

      # Typecheck and lint are separate steps so a failure names the tool that failed
      # instead of surfacing as "build exited 1" after both have run.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The github-actions reporter turns a failed test into a check annotation,
      # so a red run names the test even before anyone opens the log.
      - name: Unit tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=github-actions

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
