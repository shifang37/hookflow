name: sdk

# The Java SDK is a separate Maven project (sdk/java), independent of the Spring
# Boot build. It gets its own workflow so an SDK-only change is fast to validate
# and cannot be hidden by the server's Testcontainers run.
on:
  push:
    branches: [master, main]
    paths:
      - 'sdk/java/**'
      - '.github/workflows/sdk.yml'
  pull_request:
    paths:
      - 'sdk/java/**'
      - '.github/workflows/sdk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4

      # The SDK targets Java 17 on purpose: consumers are not required to run the
      # server's Java 21.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      # `verify` runs the MockWebServer suite and the JaCoCo LINE >= 80 % gate.
      - name: Unit tests and coverage gate
        run: mvn -B verify

      # A broken JavaDoc is a documentation regression, so fail on it explicitly.
      - name: JavaDoc
        run: mvn -B javadoc:javadoc

      - name: Package source and JavaDoc jars
        run: mvn -B source:jar javadoc:jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-coverage
          path: sdk/java/target/site/jacoco/
          if-no-files-found: ignore
