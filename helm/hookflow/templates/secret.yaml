{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hookflow.fullname" . }}
  labels:
    {{- include "hookflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  HOOKFLOW_MASTER_KEY: {{ required "secrets.masterKey is required when secrets.create=true" .Values.secrets.masterKey | quote }}
  HOOKFLOW_BOOTSTRAP_TOKEN: {{ required "secrets.bootstrapToken is required when secrets.create=true" .Values.secrets.bootstrapToken | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required when secrets.create=true" .Values.secrets.dbPassword | quote }}
  MQ_PASSWORD: {{ required "secrets.mqPassword is required when secrets.create=true" .Values.secrets.mqPassword | quote }}
{{- end }}
