# jqwik configuration.
#
# On failure, replay the exact failing sample first, then continue with the same
# seed. Without this jqwik re-derives random samples on every run and logs a wall
# of "after-failure" noise, which makes CI output unreadable.
jqwik.after-failure=PREVIOUS_SEED
jqwik.database=target/jqwik-database

# 200 tries per property keeps the unit test phase around a second while still
# exploring far more of the input space than any example-based test.
jqwik.tries.default=200
