name: hookflow

# Local demo stack. Everything a reviewer needs to see the full delivery path:
#   docker compose up -d
#   java -cp target/classes dev.hookflow.tools.MockReceiver 9099 <signing-secret>
#   ./scripts/demo.ps1        (or ./scripts/demo.sh)
#
# MySQL is pinned to an LTS line; Redis and RabbitMQ are pinned to a major line
# on purpose so that a patch upgrade never changes delivery semantics silently.

services:
  mysql:
    image: mysql:8.4
    container_name: hookflow-mysql
    command:
      - --innodb-flush-log-at-trx-commit=1
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hookflow
      MYSQL_USER: hookflow
      MYSQL_PASSWORD: hookflow
      TZ: UTC
    ports:
      # Host port is configurable so the demo does not fight a MySQL that is
      # already listening on 3306. Set DB_PUBLISH_PORT=13306 and DB_PORT=13306.
      - "${DB_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhookflow", "-phookflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: hookflow-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hookflow-rabbitmq
    hostname: hookflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hookflow
      RABBITMQ_DEFAULT_PASS: hookflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Trace collector (v0.3). Optional, its own profile:
  #   docker compose --profile tracing up -d
  #   .\mvnw.cmd spring-boot:run -Dspring-boot.run.arguments="--management.otlp.tracing.export.enabled=true"
  #
  # A separate profile on purpose: `docker compose up -d` must keep working on a
  # machine that cannot pull this image, and OTLP export is opt-in in the app
  # (management.otlp.tracing.export.enabled=false by default), so nothing else
  # depends on the collector being reachable.
  #
  # Known environment problem (this machine, 2026-10-22): every jaegertracing tag
  # fails to pull with
  #   failed commit on ref "...": failed size validation: 2840 != 27969
  # That is the Docker daemon rejecting a layer, not a bad tag - two different tags
  # failed identically. The trace-continuity claim therefore rests on TracingIT
  # (assertions on the wire), not on a screenshot of the Jaeger UI. See
  # docs/operations.md section 9.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: hookflow-jaeger
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookflow-app
    profiles: ["full"]
    environment:
      DB_HOST: mysql
      MQ_HOST: rabbitmq
      REDIS_HOST: redis
      HOOKFLOW_MASTER_KEY: ${HOOKFLOW_MASTER_KEY:-hookflow-dev-master-key-change-in-production-32}
      HOOKFLOW_BOOTSTRAP_TOKEN: ${HOOKFLOW_BOOTSTRAP_TOKEN:-hookflow-dev-bootstrap-token}
      # Containerised demo exports traces; a host-run demo keeps them off.
      OTLP_EXPORT: ${OTLP_EXPORT:-true}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      # The demo console (/demo/) provisions its own tenants and its /v1/demo/** API
      # has no authentication. Fine for a local stack; set to false if this port is
      # reachable by anyone else. See docs/demo.md.
      HOOKFLOW_DEMO_ENABLED: ${HOOKFLOW_DEMO_ENABLED:-true}
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
  rabbit-data:
